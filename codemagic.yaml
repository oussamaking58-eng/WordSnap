workflows:
  ios-workflow:
    name: iOS LingoSnap Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Configure iOS
        script: |
          # Force Deployment Target to 13.0 in project file
          find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' {} +
          # Delete stale registrants to force fresh link
          rm -f ios/Runner/GeneratedPluginRegistrant.*
          # This will now succeed thanks to our 'Safe Podfile'
          flutter build ios --config-only --no-codesign
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
      - name: Flutter build iOS
        script: |
          flutter build ios --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - oussamaking58@gmail.com
