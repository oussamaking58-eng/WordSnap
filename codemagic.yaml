workflows:
  ios-workflow:
    name: iOS LingoSnap Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Configure iOS
        script: |
          cd ios
          pod deintegrate || true
          rm -rf Pods Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData
          pod repo update
          pod install

          # CocoaPods sometimes doesn't auto-update Flutter xcconfig files on CI.
          # Force-inject the xcconfig includes so FRAMEWORK_SEARCH_PATHS reaches Xcode.
          DEBUG_XCCONFIG="Flutter/Debug.xcconfig"
          RELEASE_XCCONFIG="Flutter/Release.xcconfig"
          DEBUG_POD_XCCONFIG="../Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"
          RELEASE_POD_XCCONFIG="../Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"

          grep -qF "$DEBUG_POD_XCCONFIG" "$DEBUG_XCCONFIG" || \
            echo "#include? \"$DEBUG_POD_XCCONFIG\"" >> "$DEBUG_XCCONFIG"
          grep -qF "$RELEASE_POD_XCCONFIG" "$RELEASE_XCCONFIG" || \
            echo "#include? \"$RELEASE_POD_XCCONFIG\"" >> "$RELEASE_XCCONFIG"

          echo "=== Debug.xcconfig ==="
          cat "$DEBUG_XCCONFIG"
          echo "=== Release.xcconfig ==="
          cat "$RELEASE_XCCONFIG"
      - name: Flutter build iOS
        script: |
          flutter build ios --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - oussamaking58@gmail.com
