workflows:
  ios-workflow:
    name: iOS LingoSnap Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter clean
          flutter pub get
      - name: Configure iOS
        script: |
          cd ios
          # Full deintegration: removes ALL CocoaPods traces from the Xcode project
          # so that pod install re-adds xcconfig references completely fresh
          pod deintegrate || true
          rm -rf Pods Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData
          pod repo update
          pod install
      - name: Flutter build iOS
        script: |
          flutter build ios --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - oussamaking58@gmail.com
